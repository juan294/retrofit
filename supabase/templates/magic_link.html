<!--
  Retrofit sign-in email (Supabase Auth). The local stacks use this file for both the
  "Confirm signup" and "Magic Link" templates (supabase/config.toml); the production project
  uses the same body for both, set in its Auth settings (parent plan, Phase 2 external action 3).
  The link carries only the token hash; /auth/confirm verifies it once on the server.
-->
<h2>Sign in to Retrofit</h2>
<p>Follow this link to sign in to Retrofit. It works once, for one hour. Open it in the browser where you asked for it.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email">Sign in to Retrofit</a></p>
<p>If you did not ask to sign in, ignore this email. Nobody can sign in without this link.</p>
